name: Demo Playwright CI

on:
  push:
    paths:
      - 'e2e-login-demo/**'
      - '.github/workflows/demo-playwright-ci.yml'
  pull_request:
    paths:
      - 'e2e-login-demo/**'
      - '.github/workflows/demo-playwright-ci.yml'
  workflow_dispatch:

# Allow the job to write to gh-pages branch and post summaries
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e-login-demo
    env:
      PLAYWRIGHT_BROWSERS_PATH: ./.cache/ms-playwright
      BASE_URL: https://www.saucedemo.com
      AUTH_USERNAME: standard_user
      AUTH_PASSWORD: secret_sauce

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e-login-demo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run Playwright tests
        run: npm test

      # ── Option 3: inline summary in Actions UI ────────────────────────────
      - name: Post test summary
        if: always()
        uses: daun/playwright-report-summary@v3
        with:
          report-file: e2e-login-demo/playwright-report/index.html

      # ── Artifacts ─────────────────────────────────────────────────────────
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e-login-demo/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: e2e-login-demo/test-results/
          retention-days: 7

      # ── Option 2: publish full report to GitHub Pages ────────────────────
      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: e2e-login-demo/playwright-report
          destination_dir: playwright-report
          keep_files: false
          commit_message: "ci: update Playwright report [${{ github.run_number }}]"
