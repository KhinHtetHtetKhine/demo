name: Demo Playwright CI

on:
  push:
    paths:
      - 'e2e-login-demo/**'
      - '.github/workflows/demo-playwright-ci.yml'
  pull_request:
    paths:
      - 'e2e-login-demo/**'
      - '.github/workflows/demo-playwright-ci.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e-login-demo
    env:
      PLAYWRIGHT_BROWSERS_PATH: ./.cache/ms-playwright
      BASE_URL: https://www.saucedemo.com
      AUTH_USERNAME: standard_user
      AUTH_PASSWORD: secret_sauce

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e-login-demo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run Playwright tests
        run: npm test

      # ── Option 3: inline summary written to GitHub Actions job summary ────
      - name: Post test summary
        if: always()
        run: |
          REPORT="playwright-report/index.html"
          PASSED=$(grep -o '[0-9]* passed' $REPORT | grep -o '[0-9]*' | head -1 || echo 0)
          FAILED=$(grep -o '[0-9]* failed' $REPORT | grep -o '[0-9]*' | head -1 || echo 0)
          SKIPPED=$(grep -o '[0-9]* skipped' $REPORT | grep -o '[0-9]*' | head -1 || echo 0)
          echo "## 🎭 Playwright Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed  | ${PASSED:-0} |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed  | ${FAILED:-0} |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏭ Skipped | ${SKIPPED:-0} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📋 [View full report on GitHub Pages](https://khinhtethtetkhine.github.io/demo/playwright-report/)" >> $GITHUB_STEP_SUMMARY

      # ── Artifacts ─────────────────────────────────────────────────────────
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e-login-demo/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: e2e-login-demo/test-results/
          retention-days: 7

      # ── Option 2: publish full report to GitHub Pages ─────────────────────
      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: e2e-login-demo/playwright-report
          destination_dir: playwright-report
          keep_files: false
          commit_message: "ci: update Playwright report [${{ github.run_number }}]"
