name: Demo Playwright CI

on:
  push:
    paths:
      - 'e2e-login-demo/**'
      - '.github/workflows/demo-playwright-ci.yml'
  pull_request:
    paths:
      - 'e2e-login-demo/**'
      - '.github/workflows/demo-playwright-ci.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e-login-demo
    env:
      PLAYWRIGHT_BROWSERS_PATH: ./.cache/ms-playwright
      BASE_URL: https://www.saucedemo.com
      AUTH_USERNAME: standard_user
      AUTH_PASSWORD: secret_sauce

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e-login-demo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run Playwright tests
        run: npm test

      - name: Post test summary
        if: always()
        run: |
          RESULTS="playwright-report/results.json"
          PASSED=$(node -e "const r=require('./$RESULTS'); console.log(r.stats.expected)" 2>/dev/null || echo 0)
          FAILED=$(node -e "const r=require('./$RESULTS'); console.log(r.stats.unexpected)" 2>/dev/null || echo 0)
          SKIPPED=$(node -e "const r=require('./$RESULTS'); console.log(r.stats.skipped)" 2>/dev/null || echo 0)
          REPORT_URL="https://khinhtethtetkhine.github.io/demo/playwright-report/"
          echo "## 🎭 Playwright Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed  | ${PASSED:-0} |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed  | ${FAILED:-0} |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏭ Skipped | ${SKIPPED:-0} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📋 [View full report on GitHub Pages]($REPORT_URL)" >> $GITHUB_STEP_SUMMARY
          echo "::notice title=Playwright Report::View full report at $REPORT_URL"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e-login-demo/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: e2e-login-demo/test-results/
          retention-days: 7

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: e2e-login-demo/playwright-report
          destination_dir: playwright-report
          keep_files: false
          commit_message: "ci: update Playwright report [${{ github.run_number }}]"

      - name: Deploy root redirect to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gh-pages-root
          destination_dir: .
          keep_files: true
          commit_message: "ci: update root redirect"
