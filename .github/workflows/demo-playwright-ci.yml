name: Demo Playwright CI

on:
  push:
    paths:
      - 'e2e-login-demo/**'
      - '.github/workflows/demo-playwright-ci.yml'
  pull_request:
    paths:
      - 'e2e-login-demo/**'
      - '.github/workflows/demo-playwright-ci.yml'
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e-login-demo
    env:
      PLAYWRIGHT_BROWSERS_PATH: ./.cache/ms-playwright

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e-login-demo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run Playwright tests
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e-login-demo/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: e2e-login-demo/test-results/
          retention-days: 7
